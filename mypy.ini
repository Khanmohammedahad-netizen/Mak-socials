[mypy]
python_version = 3.11
exclude = (?x)(
    ^venv311/
    | ^legacy/
    | ^dashboard/
    | ^migrations/
  )

# Strict on the new foundation only, per Phase 0 scope. The existing
# engine/*.py pipeline is untyped legacy code — bringing it under mypy
# is a separate, later cleanup, not part of this phase.
[mypy-src.core.*]
strict = True

[mypy-engine.*]
ignore_errors = True

[mypy-dashboard_api]
ignore_errors = True
