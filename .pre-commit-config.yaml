repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: >
          (?x)^(
              \.secrets\.baseline|
              venv311/.*|
              dashboard/backend/.*|
              dashboard/frontend/.*|
              output/.*
          )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        # Scoped to src/ + tests/ only. engine/*.py is pre-existing legacy
        # code with its own known lint debt (see docs/AUDIT.md) — Phase 0
        # is guardrails, not a drive-by reformat of working code.
        files: ^(src|tests)/
        args: ["--fix"]
